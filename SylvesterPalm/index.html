/* ===== SCROLLING PHOTO WALL (sideways) ===== */
.masonry-wall{
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:hidden;
  position:relative;
  width:100vw;
  margin-left:50%;
  transform:translateX(-50%);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 4%,#000 96%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 4%,#000 96%,transparent 100%);
}
.scroll-row{height:230px;overflow:hidden;position:relative;}
.scroll-track{
  display:flex;
  flex-direction:row;
  height:100%;
  width:max-content;
  will-change:transform;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
.scroll-track.dir-left{animation-name:scrollLeft;}
.scroll-track.dir-right{animation-name:scrollRight;}
@keyframes scrollLeft{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}
@keyframes scrollRight{
  from{transform:translateX(-50%);}
  to{transform:translateX(0);}
}
.masonry-wall.wall-paused .scroll-track{animation-play-state:paused;}

.masonry-item{position:relative;overflow:hidden;border-radius:6px;cursor:pointer;background:#112e1c;height:100%;flex:0 0 auto;margin-right:10px;min-width:160px;}
.masonry-item img{height:100%;width:auto;display:block;filter:saturate(1.14) contrast(1.05) brightness(1.04);}
.masonry-item .item-overlay{position:absolute;left:0;right:0;bottom:0;background:transparent;transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94);display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;}
.masonry-item:hover .item-overlay{transform:translateY(0);}
.item-label{font-family:"DM Sans",sans-serif;font-size:0.92rem;font-weight:800;color:#FBDF80;letter-spacing:0.06em;text-shadow:0 1px 3px rgba(0,0,0,0.95),0 0 8px rgba(0,0,0,0.7);}

/* Respect users who prefer reduced motion: stop the drift, show a static wall */
@media(prefers-reduced-motion:reduce){
  .scroll-track{animation:none;width:auto;}
  .masonry-wall{-webkit-mask-image:none;mask-image:none;}
  .scroll-row{overflow-x:auto;}
  .scroll-track .masonry-item.dup{display:none;}
}
